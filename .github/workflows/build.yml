      - name: Build IPA
        id: build-step
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="${THEOS:-$RUNNER_TEMP/theos}"

          test -d "$THEOS"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          echo "Building launcher..."

          rm -rf packages
          mkdir -p packages

          make package FINALPACKAGE=1 STRIP=0

          IPA_PATH="$(find packages -type f -name '*.ipa' -print -quit)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA was produced."
            echo
            echo "Files in packages:"
            find packages -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "Initial IPA: $IPA_PATH"

          echo "Checking IPA archive..."

          unzip -t "$IPA_PATH"

          echo "Checking Payload..."

          PAYLOAD_COUNT="$(unzip -Z1 "$IPA_PATH" | grep -c '^Payload/.*\.app/' || true)"

          if [ "$PAYLOAD_COUNT" -eq 0 ]; then
            echo "ERROR: IPA does not contain a Payload/*.app directory."
            echo
            echo "IPA contents:"
            unzip -Z1 "$IPA_PATH"
            exit 1
          fi

          echo "IPA contains Payload/*.app."

          IPA_NAME="$(basename "$IPA_PATH")"

          echo "ipa-path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "ipa-name=$IPA_NAME" >> "$GITHUB_OUTPUT"

          echo "Built valid IPA:"
          echo "$IPA_NAME"
