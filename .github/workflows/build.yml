name: Build and publish IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            git \
            unzip \
            rsync \
            perl \
            python3 \
            xz-utils

      - name: Install Theos and iOS toolchain
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          rm -rf "$THEOS"
          git clone \
            --depth=1 \
            --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          export ARCH="$(uname -m)"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz" \
            --output "$RUNNER_TEMP/iOSToolchain.tar.xz"

          tar \
            --extract \
            --file "$RUNNER_TEMP/iOSToolchain.tar.xz" \
            --directory "$THEOS/toolchain"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          "$THEOS/bin/install-sdk" iPhoneOS16.5

      - name: Check IPA download configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '#define LOCAL_BUILD 1' src/RootViewController.m; then
            echo "LOCAL_BUILD must be set to 1 in src/RootViewController.m."
            exit 1
          fi

          if grep -q 'YOUR-DOMAIN.example' src/RootViewController.m; then
            echo "Replace LOCAL_URL with a direct IPA URL."
            exit 1
          fi

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            "s|__COMMIT_HASH__|$(git rev-parse --short "$GITHUB_SHA")|" \
            src/main.m

      - name: Build IPA
        id: build-step
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="${THEOS:-$RUNNER_TEMP/theos}"

          test -d "$THEOS"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          make package FINALPACKAGE=1 STRIP=0

          IPA_PATH="$(find packages -type f -name '*.ipa' -print -quit)"

          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was produced."
            find packages -maxdepth 2 -type f -print || true
            exit 1
          fi

          IPA_NAME="$(basename "$IPA_PATH")"

          echo "ipa-path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "ipa-name=$IPA_NAME" >> "$GITHUB_OUTPUT"

          echo "Built: $IPA_NAME"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeodeLauncher-ipa
          path: ${{ steps.build-step.outputs.ipa-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to GitHub Pages website
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$PAGES_TOKEN" ]; then
            echo "The PAGES_TOKEN repository secret is missing."
            exit 1
          fi

          IPA_PATH="${{ steps.build-step.outputs.ipa-path }}"
          IPA_NAME="${{ steps.build-step.outputs.ipa-name }}"
          COMMIT_SHORT="$(git rev-parse --short "$GITHUB_SHA")"
          PAGES_DIR="$RUNNER_TEMP/github-pages"

          git clone \
            --depth=1 \
            --branch main \
            "https://x-access-token:${PAGES_TOKEN}@github.com/chantinlongxthrx/chantinlongxthrx.github.io.git" \
            "$PAGES_DIR"

          mkdir -p "$PAGES_DIR/downloads"

          find "$PAGES_DIR/downloads" \
            -maxdepth 1 \
            -type f \
            -name '*.ipa' \
            -delete

          cp "$IPA_PATH" "$PAGES_DIR/downloads/$IPA_NAME"

          cat > "$PAGES_DIR/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>iOS Launcher</title>
            <style>
              :root {
                color-scheme: light dark;
              }

              body {
                max-width: 680px;
                margin: 60px auto;
                padding: 0 20px;
                font-family: system-ui, sans-serif;
                line-height: 1.6;
                background: #f5f5f7;
                color: #222;
              }

              main {
                padding: 32px;
                border-radius: 16px;
                background: white;
                box-shadow: 0 4px 20px #0001;
              }

              a.button {
                display: inline-block;
                padding: 12px 18px;
                border-radius: 10px;
                background: #007aff;
                color: white;
                text-decoration: none;
                font-weight: 600;
              }

              code {
                word-break: break-all;
              }

              @media (prefers-color-scheme: dark) {
                body {
                  background: #1c1c1e;
                  color: #f5f5f7;
                }

                main {
                  background: #2c2c2e;
                }
              }
            </style>
          </head>
          <body>
            <main>
              <h1>iOS Launcher</h1>
              <p>Latest build: <code>$IPA_NAME</code></p>
              <p>Source commit: <code>$COMMIT_SHORT</code></p>
              <p>
                <a class="button" href="./downloads/$IPA_NAME">
                  Download IPA
                </a>
              </p>
            </main>
          </body>
          </html>
          EOF

          cd "$PAGES_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html downloads/

          if git diff --cached --quiet; then
            echo "No website changes to publish."
            exit 0
          fi

          git commit -m "Publish IPA $IPA_NAME"
          git push origin main

          echo "Published website:"
          echo "https://chantinlongxthrx.github.io/"
