      - name: Build application
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="${THEOS:-$RUNNER_TEMP/theos}"

          echo "Building application..."

          make clean || true
          make FINALPACKAGE=1 STRIP=0

      - name: Create proper IPA
        id: build-step
        shell: bash
        run: |
          set -euo pipefail

          echo "Locating built .app..."

          APP_PATH="$(find . -type d -name '*.app' \
            -not -path './.git/*' \
            -not -path './.theos/*' \
            | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            find . -maxdepth 5 -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: $APP_PATH does not contain Info.plist"
            exit 1
          fi

          APP_NAME="$(basename "$APP_PATH")"
          IPA_NAME="${APP_NAME%.app}.ipa"

          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          echo "Copying application into Payload..."

          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          echo
          echo "IPA structure:"
          find "$RUNNER_TEMP/ipa" -maxdepth 3 -print

          cd "$RUNNER_TEMP/ipa"

          echo
          echo "Creating IPA archive..."

          zip -r -9 \
            "$GITHUB_WORKSPACE/$IPA_NAME" \
            Payload

          cd "$GITHUB_WORKSPACE"

          if [ ! -f "$IPA_NAME" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo
          echo "Testing IPA..."

          unzip -t "$IPA_NAME"

          echo
          echo "Checking Payload..."

          unzip -Z1 "$IPA_NAME" | grep -q '^Payload/'

          echo
          echo "Checking .app..."

          unzip -Z1 "$IPA_NAME" | grep -q '^Payload/[^/]*/Info.plist$'

          echo
          echo "========================================"
          echo "VALID IPA CREATED"
          echo "========================================"
          echo "File: $IPA_NAME"
          echo "Size:"
          du -h "$IPA_NAME"

          echo
          echo "Contents:"
          unzip -Z1 "$IPA_NAME" | head -50

          echo "ipa-path=$GITHUB_WORKSPACE/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa-name=$IPA_NAME" >> "$GITHUB_OUTPUT"
