name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            git \
            unzip \
            rsync \
            perl \
            python3 \
            xz-utils

      - name: Install Theos and iOS toolchain
        shell: bash
        run: |
          set -euo pipefail

          THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          git clone \
            --depth=1 \
            --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          ARCH="$(uname -m)"

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz" \
            --output "$RUNNER_TEMP/iOSToolchain.tar.xz"

          tar \
            --extract \
            --file "$RUNNER_TEMP/iOSToolchain.tar.xz" \
            --directory "$THEOS/toolchain"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          "$THEOS/bin/install-sdk" iPhoneOS16.5

      - name: Check IPA download configuration
        shell: bash
        run: |
          set -euo pipefail

          if grep -q 'YOUR-DOMAIN.example' src/RootViewController.m; then
            echo "ERROR: Replace LOCAL_URL in src/RootViewController.m with a direct IPA URL."
            exit 1
          fi

          if ! grep -q '#define LOCAL_BUILD 1' src/RootViewController.m; then
            echo "ERROR: LOCAL_BUILD must be set to 1."
            exit 1
          fi

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            "s|__COMMIT_HASH__|$(git rev-parse --short "$GITHUB_SHA")|" \
            src/main.m

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1 STRIP=0

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeodeLauncher-ipa
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 30
